<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="gHaircut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2fa0"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="gHaircutglow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gHaircutsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#gHaircut)"/>
  <circle cx="120" cy="500" r="140" fill="#ffffff" opacity="0.10" filter="url(#gHaircutsoft)"/>
  <circle cx="700" cy="80" r="120" fill="#ffffff" opacity="0.12" filter="url(#gHaircutsoft)"/>
  <circle cx="400" cy="260" r="260" fill="url(#gHaircutglow)"/>
