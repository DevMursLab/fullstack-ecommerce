  <g transform="translate(400,250)" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round">
    <circle cx="-70" cy="70" r="24" fill="#ffffff" opacity="0.9" stroke="none"/>
    <circle cx="70" cy="70" r="24" fill="#ffffff" opacity="0.9" stroke="none"/>
    <path d="M-52,52 L60,-70" />
    <path d="M52,52 L-60,-70" />
    <circle cx="0" cy="-8" r="6" fill="#ffffff" stroke="none"/>
  </g>
  <text x="50%" y="530" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="34" fill="#ffffff" font-weight="700">Hair Cut &amp; Style</text>
</svg>