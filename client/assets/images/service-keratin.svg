      <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#ff2fa0"/>
    </linearGradient>
    <radialGradient id="gKeratinglow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gKeratinsoft" x="-50%" y="-50%" width="200%" height="200%">
